/* HABITAGRID PG MANAGER - PREMIUM DESIGN SYSTEM */
:root{
 --nav:#101c32;
 --blue:#b58b48;
 --bg:#f4f2ed;
 --card:#ffffff;
 --text:#202b3c;
 --muted:#778091;
 --line:#e8e5de;
 --green:#23856d;
 --amber:#b58b48;
 --red:#c65353;
 --gold:#c5a46a;
 --soft:#f8f6f1;
}
body{
 background:var(--bg);
 color:var(--text);
 font-family:Inter,"Segoe UI",Arial,sans-serif;
 letter-spacing:.05px;
}
.top{
 height:68px;
 background:linear-gradient(110deg,#101c32,#1a2b46);
 padding:0 30px;
 box-shadow:0 3px 18px #101c321c;
 border-bottom:1px solid #c5a46a55;
}
.brand{
 font-size:21px;
 font-weight:750;
 letter-spacing:.3px;
 color:#f5e6c8;
}
.pill{
 background:#ffffff16;
 border:1px solid #ffffff25;
 color:#f3e8d4;
 padding:9px 15px;
}
.layout{
 min-height:calc(100vh - 68px);
}
.side{
 width:255px;
 top:68px;
 height:calc(100vh - 68px);
 background:#fff;
 border-right:1px solid #e8e5de;
 padding:22px 13px;
 box-shadow:4px 0 18px #17203308;
}
.navbtn{
 padding:12px 14px;
 margin:4px 0;
 border-radius:9px;
 color:#596477;
 font-size:13px;
 font-weight:550;
 transition:background .18s ease,color .18s ease;
}
.navbtn:hover{
 background:#f5f1e8;
 color:#8b6936;
}
.navbtn.active{
 background:linear-gradient(100deg,#f4eee2,#faf8f3);
 color:#87632e;
 font-weight:750;
 box-shadow:inset 3px 0 0 #b58b48;
}
.main{
 padding:30px 34px;
}
.pagehead{
 align-items:center;
 margin-bottom:25px;
}
.pagehead h1{
 font-size:27px;
 font-weight:750;
 letter-spacing:-.6px;
 color:#18253a;
}
.muted{
 color:#7b8492;
}
.cards{
 gap:17px;
 margin-bottom:22px;
}
.card{
 background:#fff;
 border:1px solid #eae7e0;
 border-radius:14px;
 padding:19px;
 box-shadow:0 4px 16px #17203308;
 transition:transform .18s ease,box-shadow .18s ease;
}
.cards .card:hover{
 transform:translateY(-2px);
 box-shadow:0 9px 24px #17203310;
}
.metric{
 font-size:27px;
 font-weight:750;
 letter-spacing:-.6px;
 color:#17253b;
 margin:10px 0 6px;
}
.grid2{
 gap:20px;
}
.section{
 margin-bottom:23px;
}
.section h2{
 font-size:17px;
 font-weight:700;
 color:#26344a;
}
.btn{
 background:linear-gradient(110deg,#a98142,#c4a36a);
 color:#fff;
 padding:10px 17px;
 border-radius:8px;
 font-size:13px;
 font-weight:700;
 box-shadow:0 3px 9px #a9814220;
 transition:filter .18s ease,transform .18s ease;
}
.btn:hover{
 filter:brightness(1.06);
 transform:translateY(-1px);
}
.btn.secondary{
 background:#f2f0eb;
 color:#465166;
 border:1px solid #e5e1d8;
 box-shadow:none;
}
.btn.danger{
 background:#bd5555;
 color:#fff;
}
.tablewrap{
 border:1px solid #e8e5de;
 border-radius:13px;
 box-shadow:0 3px 14px #17203307;
}
.table{
 border-collapse:separate;
 border-spacing:0;
}
.table th{
 background:#f7f5f0;
 color:#596477;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:.55px;
 font-weight:750;
 padding:14px 13px;
}
.table td{
 padding:13px;
 color:#364256;
}
.table tr:last-child td{
 border-bottom:0;
}
.table tbody tr:hover{
 background:#fcfaf6;
}
.tag{
 border-radius:20px;
 padding:5px 10px;
 font-size:10px;
 letter-spacing:.15px;
}
.tag.green{
 background:#e8f4ef;
 color:#26765f;
}
.tag.amber{
 background:#f8f0df;
 color:#96703b;
}
.tag.red{
 background:#faeaea;
 color:#ae4545;
}
.toolbar{
 gap:10px;
 margin-bottom:15px;
}
.search,.field input,.field select,.field textarea{
 border:1px solid #dedbd3;
 border-radius:8px;
 padding:11px 12px;
 color:#26344a;
 background:#fff;
 outline:none;
 transition:border .18s ease,box-shadow .18s ease;
}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{
 border-color:#b58b48;
 box-shadow:0 0 0 3px #b58b4818;
}
.field label{
 color:#465166;
 font-size:12px;
 font-weight:700;
}
.modal{
 background:#101c3275;
 backdrop-filter:blur(4px);
}
.modalbox{
 border:1px solid #e8e2d6;
 border-radius:16px;
 box-shadow:0 24px 70px #101c3240;
 padding:25px;
}
.modalhead h2{
 color:#1b2940;
 font-size:20px;
}
.close{
 background:#f3f0e9;
 color:#596477;
 border-radius:8px;
}
.notice{
 background:#f8f5ee;
 border-left:4px solid #b58b48;
 border-radius:8px;
 padding:14px;
}
.empty{
 padding:38px 24px;
 color:#89909c;
}
@media(max-width:1050px){
 .main{padding:23px}
 .cards{grid-template-columns:repeat(3,minmax(140px,1fr))}
}
@media(max-width:760px){
 .top{height:60px;padding:0 13px}
 .side{width:185px;top:60px;height:calc(100vh - 60px);padding:13px 8px}
 .main{padding:17px 13px}
 .pagehead h1{font-size:22px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:14px}
 .metric{font-size:23px}
 .brand{font-size:16px}
}

/* HABITAGRID PG MANAGER - PREMIUM LOGIN */
.pg-login{min-height:100vh;background:radial-gradient(circle at 15% 15%,#263c55 0,#142338 38%,#0b1422 100%);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;padding:6vw;gap:5vw;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}
.pg-login-brand{max-width:620px}
.pg-login-logo{display:flex;align-items:center;gap:14px;margin-bottom:55px}
.pg-login-symbol{width:52px;height:52px;border:1px solid #c9aa69;border-radius:15px;display:grid;place-items:center;color:#e4c887;font-size:25px}
.pg-login-wordmark{font-size:23px;letter-spacing:3px;font-weight:700;color:#f5e8c8}
.pg-login-submark{font-size:10px;letter-spacing:4px;color:#c9aa69;margin-top:5px}
.pg-login-brand h1{font-size:clamp(36px,5vw,62px);line-height:1.08;letter-spacing:-1.8px;color:#fff;margin:0 0 22px}
.pg-login-brand>p{font-size:17px;line-height:1.8;color:#c3cedb;max-width:510px}
.pg-login-features{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.pg-login-features span{border:1px solid #526174;border-radius:30px;padding:9px 14px;color:#e1d3b4;font-size:12px}
.pg-login-panel{background:#fff;color:#17263b;border-radius:22px;padding:clamp(26px,4vw,46px);width:100%;max-width:440px;justify-self:center;box-shadow:0 25px 80px #0005}
.pg-login-panel h2{font-size:27px;margin:0 0 8px;color:#17263b}
.pg-login-panel .pg-login-intro{color:#718096;font-size:14px;margin-bottom:30px}
.pg-login-panel .field{margin-bottom:17px}
.pg-login-panel .field label{color:#46566c;font-size:12px;font-weight:700;letter-spacing:.5px}
.pg-login-panel .field input{width:100%;box-sizing:border-box;min-height:48px;border:1px solid #dce2e9;border-radius:9px;padding:12px;font-size:15px;background:#fbfcfd;color:#17263b}
.pg-login-panel .field input:focus{outline:2px solid #d5bd88;border-color:#b99b60}
.pg-login-submit{width:100%;min-height:50px;border:0;border-radius:9px;background:linear-gradient(110deg,#b89452,#dfc78e);color:#172235;font-weight:800;letter-spacing:1px;cursor:pointer;margin-top:8px}
.pg-login-submit:hover{filter:brightness(1.05)}
.pg-login-demo{margin-top:22px;padding:13px;background:#f5f3ee;border-radius:9px;color:#697386;font-size:12px;line-height:1.7}
.pg-login-demo strong{color:#28374a}
.pg-demo-countdown{color:#f0d59b;font-size:12px;font-weight:700;white-space:nowrap}
@media(max-width:800px){.pg-login{grid-template-columns:1fr;padding:32px 20px;gap:25px}.pg-login-logo{margin-bottom:25px}.pg-login-brand h1{font-size:38px}.pg-login-brand>p{font-size:14px}.pg-login-panel{max-width:none;box-sizing:border-box}}
@media(max-width:420px){.pg-login{padding:24px 15px}.pg-login-brand h1{font-size:32px}.pg-login-panel{padding:23px}}

/* HABITAGRID PG MANAGER - PUBLIC LANDING PAGE */
.pg-site{background:#f7f6f2;color:#17263b;font-family:Inter,"Segoe UI",Arial,sans-serif;overflow:hidden}
.pg-site *{box-sizing:border-box}
.pg-nav{position:sticky;top:0;z-index:20;background:#101c32;color:#fff;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c5a46a66}
.pg-brand{display:flex;align-items:center;gap:12px}
.pg-brand-mark{width:42px;height:42px;border:1px solid #c5a46a;border-radius:12px;display:grid;place-items:center;color:#e3c78f;font-size:23px}
.pg-brand-name{font-weight:800;letter-spacing:2px;color:#f5e6c8;font-size:18px}
.pg-brand-sub{font-size:9px;letter-spacing:3px;color:#c5a46a;margin-top:3px}
.pg-nav-links{display:flex;gap:25px;align-items:center}
.pg-nav-links a{color:#e6eaf0;text-decoration:none;font-size:13px}
.pg-nav-links a:hover{color:#e3c78f}
.pg-nav-cta,.pg-cta{display:inline-block;background:linear-gradient(110deg,#b89452,#e2cc98);color:#17263b!important;text-decoration:none;border-radius:7px;padding:12px 19px;font-weight:800;font-size:12px;letter-spacing:.5px}
.pg-hero{background:radial-gradient(circle at 80% 20%,#263d5b 0,#172941 42%,#0d1728 100%);color:#fff;padding:78px 7% 86px;display:grid;grid-template-columns:1.08fr .92fr;gap:55px;align-items:center}
.pg-eyebrow{color:#d9bd82;font-size:11px;letter-spacing:2.5px;font-weight:800;text-transform:uppercase}
.pg-hero h1{font-size:clamp(39px,5vw,65px);line-height:1.08;letter-spacing:-2px;margin:20px 0;color:#fff;max-width:680px}
.pg-hero h1 span{color:#e0c58e}
.pg-hero-copy{color:#c8d1dc;font-size:16px;line-height:1.85;max-width:570px}
.pg-hero-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px}
.pg-hero-secondary{color:#f2e6ce;text-decoration:none;border:1px solid #8b9aae;border-radius:7px;padding:11px 17px;font-size:12px}
.pg-hero-note{color:#aebaca;font-size:11px;margin-top:20px}
.pg-preview{background:#fff;border:1px solid #d9c69e;border-radius:15px;padding:16px;box-shadow:0 25px 70px #0005;transform:rotate(1deg);color:#17263b}
.pg-preview-top{display:flex;justify-content:space-between;align-items:center;padding:5px 3px 15px;border-bottom:1px solid #e8e5de;font-size:12px;font-weight:800}
.pg-preview-tag{background:#f4efe4;color:#8a6a35;border-radius:20px;padding:6px 10px;font-size:9px}
.pg-preview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.pg-preview-stat{background:#f7f6f2;border:1px solid #ece8df;border-radius:9px;padding:13px}
.pg-preview-stat small{display:block;color:#7b8492;font-size:10px}
.pg-preview-stat strong{display:block;font-size:23px;margin-top:5px}
.pg-preview-bottom{background:#14233a;color:#fff;padding:15px;border-radius:9px;font-size:11px;line-height:1.8}
.pg-section{padding:76px 7%;max-width:1500px;margin:auto}
.pg-section-heading{text-align:center;max-width:760px;margin:0 auto 38px}
.pg-section-heading .pg-eyebrow{color:#9a753d}
.pg-section-heading h2{font-size:clamp(28px,3.5vw,42px);line-height:1.2;margin:13px 0;color:#17263b}
.pg-section-heading p{color:#727d8d;line-height:1.8;font-size:14px}
.pg-feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pg-feature{background:#fff;border:1px solid #e6e0d3;border-radius:13px;padding:26px;box-shadow:0 5px 20px #18263b08}
.pg-feature-top{display:flex;align-items:center;gap:13px;margin-bottom:15px}
.pg-feature-icon{width:43px;height:43px;border-radius:11px;background:#f4efe4;color:#99743e;display:grid;place-items:center;font-size:20px}
.pg-feature h3{font-size:17px;margin:0;color:#17263b}
.pg-feature-kicker{font-size:9px;letter-spacing:1.5px;color:#a17c45;font-weight:800;margin-bottom:5px}
.pg-feature p{font-size:13px;line-height:1.75;color:#6d7787}
.pg-feature ul{padding-left:18px;margin:13px 0 0;color:#34445a;font-size:12px;line-height:2}
.pg-feature-preview{background:#f7f6f2;border:1px solid #ebe6dc;border-radius:9px;margin-top:18px;padding:14px}
.pg-feature-preview strong{font-size:11px;color:#17263b}
.pg-preview-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pg-preview-chips span{background:#fff;border:1px solid #e5dfd3;padding:6px 9px;border-radius:6px;font-size:10px;color:#5e6878}
.pg-why{background:#101c32;color:#fff}
.pg-why .pg-section-heading h2{color:#fff}
.pg-why .pg-section-heading p{color:#c0cad6}
.pg-benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pg-benefit{border:1px solid #ffffff25;border-radius:11px;padding:22px}
.pg-benefit strong{display:block;color:#e3c78f;margin-bottom:9px;font-size:14px}
.pg-benefit p{color:#c2ccd8;font-size:12px;line-height:1.8;margin:0}
.pg-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pg-step{background:#fff;border:1px solid #e8e2d7;border-radius:12px;padding:23px}
.pg-step-no{font-size:25px;font-weight:800;color:#b18a4c}
.pg-step h3{font-size:15px;margin:12px 0 8px}
.pg-step p{font-size:12px;line-height:1.8;color:#737d8b}
.pg-types{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pg-types span{padding:12px 17px;background:#fff;border:1px solid #e5dfd3;border-radius:30px;color:#35445a;font-size:12px}
.pg-final-cta{background:linear-gradient(110deg,#172941,#101c32);text-align:center;color:#fff;padding:65px 7%}
.pg-final-cta h2{font-size:clamp(28px,4vw,42px);margin:0 0 13px}
.pg-final-cta p{color:#c5ced9;font-size:14px;line-height:1.8;margin:0 auto 25px;max-width:620px}
.pg-footer{background:#0b1422;color:#9eabba;padding:22px 7%;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:11px}
.pg-footer strong{color:#e3c78f}
@media(max-width:850px){.pg-hero{grid-template-columns:1fr;padding:55px 6%;gap:35px}.pg-nav-links{gap:12px}.pg-nav-links a:not(.pg-nav-cta){display:none}.pg-feature-grid{grid-template-columns:1fr}.pg-benefits{grid-template-columns:1fr 1fr}}

</style>

.dashboard-metrics{gap:17px;margin-bottom:24px}

function validateHabitaGridForm(title,o){
 let t=title.toLowerCase(),required=[];
 if(t.includes('payment'))required=['flat','resident','month','date'];
 else if(t.includes('complaint'))required=['flat','subject','date'];
 else if(t.includes('expense'))required=['date','category','vendor'];
 else if(t.includes('tenant'))required=['name','flat','mobile','start','end','idType','idFile','addressType','addressFile','ref1Name','ref1Mobile','ref2Name','ref2Mobile','agreementFile','agreementStart','agreementEnd'];
 for(let k of required){if(!String(o[k]??'').trim())return 'Please complete the required field: '+k+'.';}
 if(t.includes('tenant')){
  for(let k of ['mobile','ref1Mobile','ref2Mobile']){
   let v=String(o[k]||'').trim();
   let valid=/^[6-9]\d{9}$/.test(v)||/^\+91[6-9]\d{9}$/.test(v)||/^\+[1-9]\d{7,14}$/.test(v);
   if(!valid)return 'Enter a valid mobile number for '+k+': use 10 Indian digits starting 6ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Å“9, or an international number with + and country code.';
  }
  if(o.end<o.start)return 'Occupancy end date cannot be before the start date.';
  if(o.agreementEnd<o.agreementStart)return 'Agreement end date cannot be before its start date.';
  if(o.addressStatus==='Verified'){
   if(o.identityStatus!=='Verified')return 'Identity verification must be completed before address verification.';
   if(!['Yes','No'].includes(o.addressMatch))return 'Confirm whether the document address matches before verifying the address.';
   if(o.addressMatch==='No'&&o.ownerApproval!=='Approved')return 'Flat Owner approval is required when the document address does not match.';
   if(o.addressType==='Other'&&o.ownerApproval!=='Approved')return 'Flat Owner approval is required for Other address proof.';
   if(o.ownerApproval==='Rejected')return 'Flat Owner approval was rejected. Address verification is not allowed.';
  }
  if(o.status==='Verified'){
   if(o.identityStatus==='Rejected'||o.addressStatus==='Rejected'||o.agreementStatus==='Rejected'||o.ref1Status==='Rejected'||o.ref2Status==='Rejected')return 'A KYC item is rejected. Please review the record.';
   if(o.ownerApproval==='Rejected')return 'Flat Owner approval was rejected. Overall KYC cannot be Verified.';
   if(o.identityStatus!=='Verified')return 'Identity verification must be completed first.';
   if(!['Yes','No'].includes(o.addressMatch))return 'Please confirm whether the document address matches the declared address.';
   if(o.addressMatch==='No'&&o.ownerApproval!=='Approved')return 'Flat Owner approval is required when the document address does not match.';
   if(o.addressType==='Other'&&o.ownerApproval!=='Approved')return 'Flat Owner approval is required for Other address proof.';
   if(o.addressStatus!=='Verified')return 'Address verification must be completed first.';
   if(o.agreementStatus!=='Verified')return 'Agreement verification must be completed first.';
   if(o.ref1Status!=='Verified'||o.ref2Status!=='Verified')return 'Both reference contacts must be verified first.';
  }
 }
 if(t.includes('notice')){
  for(let k of ['title','date','startTime','endTime','area','message'])if(!String(o[k]||'').trim())return 'Please complete the required notice field: '+k+'.';
  if(o.endTime<=o.startTime)return 'Expected end time must be later than start time.';
  if(o.audience==='Specific Flat'&&!String(o.targetFlat||'').trim())return 'Please enter the flat number for a Specific Flat notice.';
 }
 if(t.includes('payment')||t.includes('expense')){let amount=Number(o.amount);if(!Number.isFinite(amount)||amount<=0)return 'Please enter an amount greater than zero.';}
 if(o.date){let m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(o.date);if(!m)return 'Please enter a valid date.';let d=new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])));if(d.getUTCFullYear()!==Number(m[1])||d.getUTCMonth()!==Number(m[2])-1||d.getUTCDate()!==Number(m[3]))return 'Please enter a valid date.';}
 return '';
}
function addForm(title,fields,callback){
 modal(title,`<form id="genericForm"><div class="formgrid">${fields.join('')}</div>${formActions()}</form>`);
 document.getElementById('genericForm').onsubmit=e=>{
  e.preventDefault();
  let o=Object.fromEntries(new FormData(e.target).entries());
  for(let k of ['idFile','addressFile','agreementFile']){
   let f=e.target.elements[k+'Upload']?.files?.[0];
   if(f){
    if(f.size>10*1024*1024){alert('Please select a file smaller than 10 MB.');return;}

   }
   delete o[k+'Upload'];
  }
  let problem=validateHabitaGridForm(title,o);
  if(problem){alert(problem);return}
  let result=callback(o);
  if(result===false)return;
  closeModal();
  save();
  render();
 }
}

function noticeState(n){
 if(n.status!=='Published')return n.status||'Draft';
 if(!n.date||!n.endTime)return 'Legacy / no expiry';
 let end=new Date(n.date+'T'+n.endTime);
 if(!Number.isFinite(end.getTime()))return 'Check schedule';
 return end.getTime()<Date.now()?'Expired':'Published';
}
function notices(){
 let current=db.notices.filter(x=>noticeState(x)==='Published');
 let currentHtml=current.length?current.map(x=>{
  let time=x.startTime||x.endTime?(x.startTime||'Not set')+' - '+(x.endTime||'Not set'):'Not scheduled';
  return '<div class="notice"><b>'+esc(x.title)+'</b><div class="mini">'+esc(x.type||'Notice')+' | '+esc(x.date||'Date not set')+' | '+esc(time)+' | '+esc(x.area||'Not specified')+'</div><p>'+esc(x.message||'')+'</p></div>';
 }).join(''):'<div class="empty">No current published alerts.</div>';
 let rows=db.notices.map((x,i)=>{
  let state=noticeState(x);
  let time=x.startTime||x.endTime?(x.startTime||'Not set')+' - '+(x.endTime||'Not set'):'Not scheduled';
  return '<tr><td>'+esc(x.id)+'</td><td>'+esc(x.date||'Not scheduled')+'</td><td>'+esc(x.title||'')+'</td><td>'+esc(x.type||'General Update')+'</td><td>'+esc(time)+'</td><td>'+esc(x.area||'Not specified')+'</td><td>'+esc(x.audience||'')+'</td><td>'+tag(state)+'</td><td><button class="btn secondary" onclick="editNotice('+i+')">Edit</button> '+(state==='Published'?'<button class="btn secondary" onclick="shareNotice('+i+')">Share</button>':'')+'</td></tr>';
 });
 document.getElementById('main').innerHTML=head('Notices & Communication','Create, schedule and share important resident announcements','<button class="btn" onclick="addNotice()">+ Notice</button>')+'<div class="section"><h2>Current Alerts</h2>'+currentHtml+'</div><div class="section"><h2>All Notices</h2>'+table(['ID','Date','Title','Type','Time','Affected Area','Audience','Status','Actions'],rows)+'</div>';
}
function nextNoticeId(){
 let used=new Set(db.notices.map(n=>String(n.id||'').toUpperCase()));
 let highest=0;
 db.notices.forEach(n=>{
  let match=String(n.id||'').match(/^NOT-(\d+)$/i);
  if(match)highest=Math.max(highest,Number(match[1]));
 });
 let next=highest+1;
 let id='NOT-'+String(next).padStart(2,'0');
 while(used.has(id.toUpperCase())){
  next++;
  id='NOT-'+String(next).padStart(2,'0');
 }
 return id;
}function noticeFields(x){
 return [field('Notice ID','id',x.id||nextNoticeId(),'text','readonly'),select('Notice Type','type',['Meeting','Power Interruption','Water Interruption','Maintenance','Emergency','General Update'],x.type||'General Update'),field('Title','title',x.title||''),field('Date','date',x.date||todayISO(),'date'),field('Start Time','startTime',x.startTime||'09:00','time'),field('Expected End Time','endTime',x.endTime||'10:00','time'),field('Affected Area','area',x.area||'All Blocks / Common Areas'),select('Audience','audience',['All Residents','Committee','Security','Specific Flat'],x.audience||'All Residents'),field('Flat Number (only for Specific Flat)','targetFlat',x.targetFlat||''),field('Message','message',x.message||'','text','required'),select('Status','status',['Draft','Published','Cancelled','Archived'],x.status||'Draft')];
}

window.shareNotice=function(i){
 let n=db.notices[i];
 if(!n||noticeState(n)!=='Published'){alert('Only current published notices can be shared.');return}
 if(!['All Residents','Specific Flat'].includes(n.audience)){alert('Resident sharing is available for All Residents or Specific Flat notices.');return}
 let people=(db.tenants||[]).filter(t=>n.audience!=='Specific Flat'||String(t.flat||'').trim().toLowerCase()===String(n.targetFlat||'').trim().toLowerCase());
 let message='HabitaGrid Notice: '+n.title+'\nType: '+(n.type||'General Update')+'\nDate: '+n.date+'\nTime: '+(n.startTime||'')+' to '+(n.endTime||'')+'\nAffected area: '+(n.area||'Not specified')+'\n\n'+n.message;
 let subject=encodeURIComponent('Society Notice: '+n.title);
 let body=encodeURIComponent(message);
 let rows=people.map(t=>{
  let email=String(t.email||'').trim();
  let emailLink=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'<a class="btn secondary" href="mailto:'+esc(email)+'?subject='+subject+'&body='+body+'">Email</a>':'<span class="mini">No valid email</span>';
  let raw=String(t.mobile||'').trim(),digits=raw.replace(/\D/g,'');
  if(digits.length===10&&/^[6-9]/.test(digits))digits='91'+digits;
  else if(!(digits.length===12&&digits.startsWith('91'))&&!(raw.startsWith('+')&&digits.length>=8&&digits.length<=15))digits='';
  let wa=digits?'<a class="btn secondary" target="_blank" rel="noopener" href="https://wa.me/'+digits+'?text='+body+'">WhatsApp</a>':'<span class="mini">No valid mobile</span>';
  return '<tr><td>'+esc(t.name||'Resident')+'</td><td>'+esc(t.flat||'')+'</td><td>'+emailLink+'</td><td>'+wa+'</td></tr>';
 });
 let content='<p>Choose Email or WhatsApp for each resident. Your device or browser will open the selected app with the notice prefilled. You must review and send it yourself.</p>'+table(['Resident','Flat','Email','WhatsApp'],rows);
 if(!people.length)content+='<p>No matching resident records found.</p>';
 content+='<p class="mini">Sample contact details may not be real or deliverable. No messages are sent automatically and no delivery or read status is tracked.</p>';
 modal('Share Notice',content);
};

function buildingFields(x={}){
 const options=(db.properties||[]).map(p=>`<option value="${esc(p.id)}" ${p.id===(x.propertyId||db.activePropertyId)?'selected':''}>${esc(p.name)} (${esc(p.code)})</option>`).join('');
 const floorCount=Number(x.floorCount||5);
 const config=['3','4','5','6'].includes(String(floorCount))?String(floorCount):'custom';
 const presets=[['3','G+2 — 3 floors'],['4','G+3 — 4 floors'],['5','G+4 — 5 floors'],['6','G+5 — 6 floors']];
 const configOptions=presets.map(([v,label])=>`<option value="${v}" ${config===v?'selected':''}>${label}</option>`).join('')+`<option value="custom" ${config==='custom'?'selected':''}>Custom floor count</option>`;
 return [
  `<div class="field"><label>Property</label><select name="propertyId" required>${options}</select></div>`,
  field('Building Name','name',x.name||'','text','required'),
  field('Building Code','code',x.code||'','text','required'),
  `<div class="field"><label>Building Configuration</label><select name="buildingConfig" onchange="const f=this.form.elements.floorCount;const n=this.form.elements.floorNames;if(this.value==='custom'){f.readOnly=false;}else{f.value=this.value;f.readOnly=true;const a=['Ground Floor','First Floor','Second Floor','Third Floor','Fourth Floor','Fifth Floor'];n.value=a.slice(0,Number(this.value)).join(String.fromCharCode(10));}">${configOptions}</select><small class="muted">Choose G+4 or G+5 for a typical PG building, or select Custom.</small></div>`,
  field('Total Number of Floors','floorCount',floorCount,'number',`min="1" max="100" required ${config==='custom'?'':'readonly'}`),
  `<div class="field"><label>Floor Names (one per line, optional)</label><textarea name="floorNames" rows="7" placeholder="Ground Floor&#10;First Floor&#10;Second Floor&#10;Third Floor&#10;Fourth Floor">${esc((x.floorNames||[]).join('\n'))}</textarea><small class="muted">Enter exactly one name per floor, or leave blank for automatic names.</small></div>`
 ];
}
function makeFloorNames(count,custom){
 const names=String(custom||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(names.length&&names.length!==count)return null;
 if(names.length)return names;
 return Array.from({length:count},(_,i)=>i===0?'Ground Floor':i===1?'First Floor':i===2?'Second Floor':i===3?'Third Floor':`Floor ${i}`);
}
window.addBuilding=function(){
 if(!db.properties.length){alert('Please add a property before adding a building.');return;}
 addForm('Add Building',buildingFields(),o=>{
  o.name=o.name.trim();
  o.code=o.code.trim().toUpperCase();
  o.floorCount=Number(o.floorCount);
  const names=makeFloorNames(o.floorCount,o.floorNames);
  if(!o.name||!o.code||!Number.isInteger(o.floorCount)||o.floorCount<1||o.floorCount>100){alert('Enter a building name, code and a floor count between 1 and 100.');return false;}
  if(!names){alert('The number of floor names must match the floor count.');return false;}
  if(db.buildings.some(b=>b.propertyId===o.propertyId&&String(b.code).toLowerCase()===o.code.toLowerCase())){alert('This building code already exists in this property.');return false;}
  o.floorNames=names;
  o.id='BLDG-'+Date.now();
  db.buildings.push(o);
 });
};

 addForm('Edit Building',buildingFields(x),o=>{
  o.name=o.name.trim();

  o.floorCount=Number(o.floorCount);
  const names=makeFloorNames(o.floorCount,o.floorNames);
  if(!o.name||!o.code||!Number.isInteger(o.floorCount)||o.floorCount<1||o.floorCount>100){alert('Enter a building name, code and a floor count between 1 and 100.');return false;}
  if(!names){alert('The number of floor names must match the floor count.');return false;}
  if(db.buildings.some((b,j)=>j!==i&&b.propertyId===o.propertyId&&String(b.code).toLowerCase()===o.code.toLowerCase())){alert('This building code already exists in this property.');return false;}
  o.id=x.id;
  o.floorNames=names;
  db.buildings[i]=o;
 });
};
window.deleteBuilding=function(i){

 if((db.rooms||[]).some(r=>r.buildingId===b.id)){alert('This building is linked to rooms. Remove or reassign those rooms before deleting it.');return;}
 if(confirm('Delete this building and its floor configuration?')){db.buildings.splice(i,1);save();render();}
};

window.editPgRoom=function(i){
 const x=db.rooms[i];
 if(!x)return;
 addForm('Edit Room',pgRoomFields(x),o=>{
  o.name=o.name.trim();
  o.code=o.code.trim().toUpperCase();
  o.bedCount=Number(o.bedCount);
  const building=(db.buildings||[]).find(b=>b.id===o.buildingId);
  if(!building||building.propertyId!==o.propertyId){alert('Please select a building belonging to the selected property.');return false;}
  if(!(building.floorNames||[]).includes(o.floorName)){alert('Please select a valid floor.');return false;}
  if(!o.name||!o.code||!Number.isInteger(o.bedCount)||o.bedCount<1){alert('Enter a room name, code and a bed count between 1 and 30.');return false;}
  const expected={'Single Sharing':1,'Double Sharing':2,'Triple Sharing':3,'Four Sharing':4};
  if(expected[o.sharingType]&&o.bedCount!==expected[o.sharingType]){alert(o.sharingType+' requires exactly '+expected[o.sharingType]+' bed(s).');return false;}
  if(db.rooms.some((r,j)=>j!==i&&r.buildingId===o.buildingId&&String(r.code).toLowerCase()===o.code.toLowerCase())){alert('This room code already exists in the selected building.');return false;}
  const currentBeds=db.beds.filter(b=>b.roomId===x.id);
  const protectedBeds=currentBeds.filter(b=>['Occupied','Reserved'].includes(b.status));
  if(o.bedCount<protectedBeds.length){alert('Cannot reduce bed count below '+protectedBeds.length+' because occupied or reserved beds must be preserved.');return false;}
  const removeCount=currentBeds.length-o.bedCount;
  if(removeCount>0){
   const removable=currentBeds.filter(b=>b.status==='Available');
   if(removable.length<removeCount){alert('Only available beds can be removed. Please release unused beds first.');return false;}
   const removeIds=new Set(removable.slice(-removeCount).map(b=>b.id));
   db.beds=db.beds.filter(b=>!removeIds.has(b.id));
  }
  if(o.bedCount>currentBeds.length){
   const usedLabels=new Set(currentBeds.map(b=>String(b.label||'')));
   let nextLabel=1;
   currentBeds.forEach(b=>{const m=String(b.label||'').match(/^Bed\s+(\d+)$/i);if(m)nextLabel=Math.max(nextLabel,Number(m[1])+1);});
   for(let n=currentBeds.length;n<o.bedCount;n++){
    let label;
    do{label='Bed '+nextLabel++;}while(usedLabels.has(label));
    usedLabels.add(label);
    let serial=Date.now();
    let id;
    do{id='BED-'+serial++;}while(db.beds.some(b=>b.id===id));
    db.beds.push({id,roomId:x.id,propertyId:o.propertyId,label,status:'Available',residentName:'',monthlyRate:0,weeklyRate:0,dailyRate:0});
   }
  }
  o.id=x.id;
  db.rooms[i]=o;
  db.beds.filter(b=>b.roomId===x.id).forEach(b=>b.propertyId=o.propertyId);
 });
};

 }

function pgRefreshChargeStatus(c){

}
function generatePgRentCharges(){
 if(!Array.isArray(db.charges))db.charges=[];
 const today=todayISO();
 const todayDate=new Date(today+'T00:00:00');
 let created=0;
 for(const r of (db.residents||[])){
  const status=String(r.status||'active').toLowerCase();
  const isActive=['active','checked in','occupied'].includes(status);
  const isCheckedOut=status==='checked out';
  if(!isActive&&!isCheckedOut)continue;
  const join=String(r.joinDate||'').slice(0,10);
  if(!join||join>today)continue;
  const joined=new Date(join+'T00:00:00');
  if(Number.isNaN(joined.getTime()))continue;
  const frequency=r.billingFrequency==='Daily'?'Daily':'Monthly';
  if(frequency==='Daily'){
   const rate=Number(r.dailyRate||0);
   if(!(rate>0))continue;
   const checkout=String(r.checkOutDate||'').slice(0,10);
   const lastNight=checkout?new Date(checkout+'T00:00:00'):todayDate;
   if(Number.isNaN(lastNight.getTime()))continue;
   lastNight.setDate(lastNight.getDate()-1);
   const endDate=lastNight<todayDate?lastNight:todayDate;
   const night=new Date(joined);
   while(night<=endDate){
    const y=night.getFullYear();
    const m=String(night.getMonth()+1).padStart(2,'0');
    const d=String(night.getDate()).padStart(2,'0');
    const nightDate=y+'-'+m+'-'+d;
    const exists=db.charges.some(c=>c.residentId===r.id&&c.kind==='Daily'&&c.period===nightDate);
    if(!exists){
     db.charges.push({
      id:'PG-CHG-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
      residentId:r.id,propertyId:r.propertyId,kind:'Daily',
      period:nightDate,label:'Daily stay - night of '+nightDate,
      startDate:nightDate,dueDate:nightDate,amount:Math.round(rate*100)/100,
      paidAmount:0,status:'Pending',createdAt:today,
      notes:'One occupied night; check-out date is excluded'
     });
     created++;
    }
    night.setDate(night.getDate()+1);
   }
   continue;
  }
  if(!isActive)continue;
  const rent=Number(r.monthlyRent||r.agreedRent||0);
  if(!(rent>0))continue;
  const firstPeriod=join.slice(0,7);
  const firstExists=db.charges.some(c=>c.residentId===r.id&&c.kind==='Prorated');
  if(!firstExists){
   const daysInMonth=new Date(joined.getFullYear(),joined.getMonth()+1,0).getDate();
   const days=daysInMonth-joined.getDate()+1;
   const amount=Number(r.firstMonthRent)>0?Number(r.firstMonthRent):Math.round((rent/daysInMonth)*days*100)/100;
   db.charges.push({
    id:'PG-CHG-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    residentId:r.id,propertyId:r.propertyId,kind:'Prorated',
    period:firstPeriod,label:'First month prorated rent',
    startDate:join,dueDate:join,amount:amount,paidAmount:0,
    status:'Pending',createdAt:today,
    notes:'Prorated from actual joining date through month end'
   });
   created++;
  }
  let cursor=new Date(joined.getFullYear(),joined.getMonth()+1,1);
  while(cursor<=todayDate){
   const y=cursor.getFullYear();
   const m=String(cursor.getMonth()+1).padStart(2,'0');
   const period=y+'-'+m;
   const exists=db.charges.some(c=>c.residentId===r.id&&c.kind==='Monthly'&&c.period===period);
   if(!exists){
    const due=period+'-01';
    db.charges.push({
     id:'PG-CHG-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
     residentId:r.id,propertyId:r.propertyId,kind:'Monthly',
     period:period,label:'Monthly rent - '+period,
     startDate:due,dueDate:due,amount:rent,paidAmount:0,
     status:'Pending',createdAt:today,notes:'Recurring monthly rent'
    });
    created++;
   }
   cursor.setMonth(cursor.getMonth()+1);
  }
 }
 for(const c of db.charges)pgRefreshChargeStatus(c);
 if(created)save();
 return created;
}

   alert('Enter a positive amount not exceeding this residentâ€™s outstanding rent balance of '+pgMoney(outstanding,r.propertyId)+'.');

  }
  let remaining=amount;
  const bills=db.charges.filter(c=>c.residentId===residentId&&pgBalance(c)>0).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate)));
  const allocations=[];
  for(const c of bills){
   if(remaining<=0)break;
   const applied=Math.min(remaining,pgBalance(c));
   c.paidAmount=Math.round((Number(c.paidAmount||0)+applied)*100)/100;
   remaining=Math.round((remaining-applied)*100)/100;
   pgRefreshChargeStatus(c);
   allocations.push({chargeId:c.id,amount:applied});
  }
  db.pgPayments.push({
   id:'PG-PAY-'+Date.now(),residentId:r.id,propertyId:r.propertyId,
   amount:amount,date:o.date,method:o.method,reference:o.reference.trim(),
   allocations:allocations,receiptNo:'HGP-'+Date.now()
  });
 });
};

window.pgViewTenantStatement=function(id){

 modal(title,`<form id="pgModuleForm"><div class="formgrid">${fields.join('')}</div>${formActions()}</form>`);
 document.getElementById('pgModuleForm').onsubmit=e=>{

 };

 if(raw===null)return;
 const amount=Number(raw);
 if(!Number.isFinite(amount)||amount<=0||amount>remaining){alert('Enter a valid amount not exceeding the remaining deposit.');return;}
 d.refundAmount=Number(d.refundAmount||0)+amount;
 d.refundDate=pgModDate();
 d.status=d.refundAmount>=Number(d.amount)?'Refunded':'Partially refunded';
 save();render();
};

function pgServicesPage(){

 const residents=db.residents||[];

 document.getElementById('main').innerHTML=

 '<div class="card"><h2>Property service settings</h2>'+table(['Property','Menu details','Meal timings','Notes','Action'],sr)+'</div>'+
 '<div class="card"><h2>Resident food preferences</h2>'+table(['Resident','Property','Food type','Menu details','Status'],rows)+

window.pgEditService=function(propertyId){
 const existing=(db.pgServiceSettings||[]).find(x=>x.propertyId===propertyId)||{};
 const props=pgModPropertyOptions();
 const fields=[
 pgModSelect('Property','propertyId',props,propertyId||existing.propertyId||''),
 field('Menu details','menuDetails',existing.menuDetails||''),
 field('Meal timings','mealTimings',existing.mealTimings||''),
 field('Service notes','notes',existing.notes||'')
 ];
 pgModForm('Configure included PG services',fields,o=>{
  const p=db.properties.find(x=>x.id===o.propertyId);if(!p)return false;
  let x=db.pgServiceSettings.find(y=>y.propertyId===o.propertyId);
  if(!x){x={propertyId:o.propertyId,foodIncluded:true,drinksIncluded:true,laundryIncluded:true};db.pgServiceSettings.push(x);}
  x.menuDetails=o.menuDetails;x.mealTimings=o.mealTimings;x.notes=o.notes;
  x.foodIncluded=true;x.drinksIncluded=true;x.laundryIncluded=true;
 });
};

/* PG EXPENSES & INCOME */
function pgFinancePage(){
 const expenses=db.pgExpenses||[],income=db.pgOtherIncome||[],payments=db.pgPayments||[];
 const collected=payments.reduce((a,x)=>a+Number(x.amount||0),0);
 const spent=expenses.reduce((a,x)=>a+Number(x.amount||0),0);
 const other=income.reduce((a,x)=>a+Number(x.amount||0),0);
 const er=expenses.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(pgModPropertyName(x.propertyId))}</td><td>${esc(x.category)}</td><td>${esc(x.vendor||'—')}</td><td>${pgModMoney(x.amount,x.propertyId)}</td><td>${esc(x.notes||'—')}</td></tr>`).join('');
 const ir=income.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(pgModPropertyName(x.propertyId))}</td><td>${esc(x.source)}</td><td>${pgModMoney(x.amount,x.propertyId)}</td><td>${esc(x.notes||'—')}</td></tr>`).join('');
 document.getElementById('main').innerHTML=
 head('Expenses & Income','PG operating financial overview. Rent, advances and deposits remain separate.',
 '<button class="btn" onclick="pgAddExpense()">+ Add expense</button> <button class="btn secondary" onclick="pgAddOtherIncome()">+ Add other income</button>')+
 cards([['Rent collected',pgModMoney(collected)],['Operating expenses',pgModMoney(spent)],['Other income',pgModMoney(other)],['Net operating movement',pgModMoney(collected+other-spent)]])+
 '<div class="notice">Booking advances and refundable security deposits are excluded from income. Rent collections are taken from the Rent & Payments module.</div>'+
 '<div class="card"><h2>Operating expenses</h2>'+table(['Date','Property','Category','Vendor','Amount','Notes'],er)+'</div>'+
 '<div class="card"><h2>Other PG income</h2>'+table(['Date','Property','Source','Amount','Notes'],ir)+'</div>';
}
window.pgAddExpense=function(){
 pgModForm('Add PG operating expense',[
 pgModSelect('Property','propertyId',pgModPropertyOptions()),
 field('Date','date',pgModDate(),'date','required'),
 pgModSelect('Category','category',['Repairs','Utilities','Staff','Cleaning','Supplies','Maintenance','Other'].map(x=>({value:x,label:x}))),
 field('Vendor / Payee','vendor'),
 field('Amount','amount','','number','min="0.01" step="0.01" required'),
 field('Notes','notes')
 ],o=>{
  if(Number(o.amount)<=0){alert('Enter an amount greater than zero.');return false;}
  db.pgExpenses.push({id:'PGEXP-'+Date.now(),...o,amount:Number(o.amount)});
 });
};
window.pgAddOtherIncome=function(){
 pgModForm('Add other PG income',[
 pgModSelect('Property','propertyId',pgModPropertyOptions()),
 field('Date received','date',pgModDate(),'date','required'),
 field('Income source','source','','text','required'),
 field('Amount received','amount','','number','min="0.01" step="0.01" required'),
 field('Notes','notes')
 ],o=>{
  if(!o.source.trim()||Number(o.amount)<=0){alert('Enter an income source and a valid amount.');return false;}
  db.pgOtherIncome.push({id:'PGINC-'+Date.now(),...o,amount:Number(o.amount)});
 });
};
